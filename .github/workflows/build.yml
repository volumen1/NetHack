name: build

on:
  push:
  pull_request:

jobs:
  linux-curses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev bison flex
      - name: Configure
        run: sh sys/unix/setup.sh sys/unix/hints/linux.501
      - name: Build and install
        run: make -j"$(nproc)" install
      - name: Smoke test
        run: python3 test/smoke.py playground
